<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IRON" />
    <meta name="description" content="IRON Workout Tracker" />
    <title>IRON</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: #0b0c0e;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        /* Push content below iPhone status bar */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      /* Prevent iOS zoom on input focus — keep font-size at 16px minimum */
      input, textarea, select {
        font-size: 16px !important;
      }
      /* Smooth scrolling for all scrollable elements */
      * {
        scroll-behavior: smooth;
      }
      /* Form controls don't inherit the page font by default */
      button, input, select, textarea { font-family: inherit; }
      /* Grouped settings cards: no divider under the last row */
      .iron-group > *:last-child { border-bottom: none !important; }
      /* Loading skeleton shimmer */
      @keyframes ironShimmer { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }
      .iron-skel { border-radius: 8px; background: linear-gradient(90deg, rgba(127,127,127,.12) 0px, rgba(127,127,127,.24) 60px, rgba(127,127,127,.12) 120px); background-size: 400px 100%; animation: ironShimmer 1.2s linear infinite; }
      /* PR celebration */
      @keyframes ironConfetti { 0% { transform: translate3d(0,-20px,0) rotate(0deg); opacity: 1; } 100% { transform: translate3d(var(--dx),105vh,0) rotate(var(--rot)); opacity: .9; } }
      .iron-confetti { position: fixed; top: 0; width: 8px; height: 14px; border-radius: 2px; pointer-events: none; z-index: 400; animation: ironConfetti var(--dur) cubic-bezier(.2,.6,.4,1) forwards; animation-delay: var(--delay); }
      @media (prefers-reduced-motion: reduce) { .iron-skel { animation: none; } .iron-confetti { display: none; } }
      /* Prevent double-tap zoom on buttons */
      button, a {
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run IRON.</noscript>
    <div id="root"></div>
  </body>
</html>
